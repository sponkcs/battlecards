cards-per-pack: 3
card-face-mode: a             # how the character face sits on cards: a (upright everywhere); b/c/d are test views (/cardadmin facetest)
holo-chance: 0.03            # chance for each character card in a pack to be holographic (0.03 = 3%: about 1 holo every 11 packs)
god-pack-weights: [0, 0, 35, 30, 22, 13]   # god pack rarity odds: Common, Uncommon, Rare, Epic, Legendary, Mythic
god-pack-chance: 0.0         # chance that any pack secretly opens as a god pack (all holo, Rare or better); 0 = only summoned ones
items-per-pack: 2            # item/trap cards added to each pack
start-countdown-ticks: 100   # once both decks are on the mat, wait this long before shuffling
pack-cooldown-ms: 400        # minimum time between pack openings per player
max-cards-per-player: 3     # cards a player can place with /cardadmin place (outside battles)
mannequin-hover: 0.3        # how far the mannequin floats above its card (blocks)
mannequin-size: 0.28        # mannequin scale; 1.0 = player size
turn-menu-delay-ticks: 40   # wait before the turn menu opens by itself (20 ticks = 1 s; -1 = never, use right-click or /sc turn)
pause-after-attack-ticks: 30  # pause after a move before the next turn starts
placeholder-skin: "Steve"   # used by cards whose skin is "placeholder". Put a textures.minecraft.net link of tools/placeholder_skin.png here
resource-pack:
  url: ""                   # public link to sneakycards-resourcepack.zip
  sha1: ""                  # 40-character sha1 of the zip (printed by tools/make_pack.py)
  required: false
rules:
  deck-cost-cap: 35            # a deck's cards cost Common 1 ... Mythic 6 each
  points-to-win: 3             # every knockout scores 1 point
  hand-limit: 7                # cards drawn past this go to the discard pile
  mana-per-turn: 1             # mana you attach to one of your cards each turn (it stays on that card)
  first-player-gets-mana: false  # false = the player who goes first gets no mana on the very first turn
  weakness-bonus: 10           # extra damage when the attacker's type beats the defender's (Strength > Magicing > Dexterity > Strength)
# solo-deck: [ ... ]           # the computer's deck in /sc solo (binder keys); default is the "Brick Wall" deck
