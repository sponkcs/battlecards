cards-per-pack: 3
holo-chance: 0.03            # chance for each character card in a pack to be holographic (0.03 = 3%: about 1 holo every 11 packs)
items-per-pack: 2            # item/trap cards added to each pack
start-countdown-ticks: 100   # once both teams are full, time to add item cards before the battle starts
pack-cooldown-ms: 400        # minimum time between pack openings per player
max-cards-per-player: 3     # cards a player can have on the mat at once
mannequin-hover: 0.3        # how far the mannequin floats above its card (blocks)
mannequin-size: 0.28        # mannequin scale; 1.0 = player size
turn-menu-delay-ticks: 40   # wait before the turn menu opens by itself (20 ticks = 1 s; -1 = never, use right-click or /sc turn)
pause-after-attack-ticks: 30  # pause after a move before the next turn starts
placeholder-skin: "Steve"   # used by cards whose skin is "placeholder". Put a textures.minecraft.net link of tools/placeholder_skin.png here
resource-pack:
  url: ""                   # public link to sneakycards-resourcepack.zip
  sha1: ""                  # 40-character sha1 of the zip (printed by tools/make_pack.py)
  required: false
rules:
  items-per-battle: 2          # item cards each player may bring
  team-cost-cap: 10            # rarity costs: Common 1, Uncommon 2, Rare 3, Epic 4, Legendary 5, Mythic 6
  energy-per-turn: 2
  energy-max: 6
  second-player-bonus-energy: 1  # the side that goes second starts with this much energy
  rest-bonus-energy: 1         # extra energy for skipping a turn
  damage-scale: 0.6            # damage = move power x this x type multiplier (x crit)
  crit-multiplier: 1.5
  type-advantage: 1.5          # Strength > Magicing > Dexterity > Strength
  type-disadvantage: 0.75
